<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion du Budget Familial - 3ayelti</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gradient-bg: linear-gradient(135deg, #1f2440 0%, #3b4371 50%, #f3904f 100%);
            --gold: #ffcc00;
            --gold-hover: #ffe066;
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            background: var(--gradient-bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            color: white;
            text-align: center;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 24px;
            box-shadow: var(--glass-shadow);
            width: 100%;
            max-width: 750px;
            position: relative;
            animation: fadeInUp 0.7s ease-out;
        }

        h2 {
            font-family: 'Bangers', cursive;
            font-size: 42px;
            margin-bottom: 25px;
            color: var(--gold);
            letter-spacing: 2px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4);
        }

        h3 {
            font-size: 20px;
            color: #a8e6cf;
            margin: 25px 0 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 8px;
        }

        label {
            font-size: 16px;
            margin-bottom: 8px;
            display: block;
            font-weight: 600;
            text-align: left;
        }

        input[type="number"],
        input[type="text"] {
            padding: 12px 16px;
            margin: 8px 0;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus,
        input[type="text"]:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: var(--gold);
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.4);
        }

        .slider-container {
            position: relative;
            width: 100%;
            margin: 15px 0 25px;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 16px;
        }

        .salary-slider,
        .age-slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 10px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            outline: none;
            transition: background 0.3s ease;
        }

        .salary-slider::-webkit-slider-thumb,
        .age-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--gold);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.6);
            transition: transform 0.2s ease;
        }

        .salary-slider::-webkit-slider-thumb:hover,
        .age-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        #salaireValeur {
            display: inline-block;
            margin-top: 10px;
            font-size: 28px;
            font-weight: 700;
            color: var(--gold);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .child-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 15px;
            text-align: left;
            animation: fadeInUp 0.4s ease-out;
        }

        .facture-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.12);
            padding: 14px 20px;
            margin: 10px 0;
            border-radius: 12px;
            transition: background 0.3s ease;
        }

        .facture-item:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .facture-item input[type="number"] {
            width: 140px;
            padding: 10px;
            margin: 0;
        }

        .facture-item label {
            margin: 0;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .facture-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            accent-color: var(--gold);
            cursor: pointer;
        }

        .facture-icon {
            font-size: 22px;
            margin-right: 10px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 16px;
            margin-top: 25px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ffcc00, #ff9900);
            color: #2c3e50;
            font-family: 'Poppins', sans-serif;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(255, 204, 0, 0.3);
        }

        button[type="submit"]:hover {
            background: linear-gradient(135deg, #ffe066, #ffaa00);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 204, 0, 0.5);
        }

        .error-message {
            background-color: rgba(255, 82, 82, 0.3);
            border: 1px solid #ff5252;
            color: white;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-size: 15px;
            font-weight: 600;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Gestion du Budget Familial 💰</h2>
        <form action="salaireFacture.php" method="POST" onsubmit="return validerFormulaire()">
            <div id="errorMessage" class="error-message"></div>

            <label for="salaire">Salaire Total Mensuel (DT) :</label>
            <div class="slider-container">
                <input type="range" id="salaire" name="salaire" class="salary-slider" min="0" max="6000" step="10"
                    value="1500" oninput="updateSalaire()">
                <span id="salaireValeur">1500 DT</span>
            </div>

            <h3>👶 Nombre d'enfants :</h3>
            <div style="text-align: left;">
                <input type="number" id="nbEnfants" name="nb_enfants" min="0" max="5" value="0"
                    placeholder="Entrez le nombre d'enfants" onchange="genererChampsEnfants()">
            </div>
            <div id="enfantsContainer"></div>

            <h3>🧾 Factures Récurrentes :</h3>
            <div class="facture-item">
                <label><input type="checkbox" name="facture[]" value="Electricité"> <span
                        class="facture-icon">⚡</span>Électricité</label>
                <input type="number" name="montant[Electricité]" placeholder="Montant (DT)">
            </div>
            <div class="facture-item">
                <label><input type="checkbox" name="facture[]" value="Eau"> <span
                        class="facture-icon">💧</span>Eau</label>
                <input type="number" name="montant[Eau]" placeholder="Montant (DT)">
            </div>
            <div class="facture-item">
                <label><input type="checkbox" name="facture[]" value="Internet"> <span
                        class="facture-icon">🌐</span>Internet</label>
                <input type="number" name="montant[Internet]" placeholder="Montant (DT)">
            </div>

            <button type="submit">Valider et Passer aux Tâches 🚀</button>
        </form>
    </div>

    <script>
        function updateSalaire() {
            let salaire = document.getElementById("salaire").value;
            document.getElementById("salaireValeur").textContent = salaire + " DT";
        }

        function updateAge(index) {
            let age = document.getElementById(`ageEnfant${index}`).value;
            document.getElementById(`ageValeur${index}`).textContent = age + " ans";
        }

        function genererChampsEnfants() {
            let nb = parseInt(document.getElementById("nbEnfants").value) || 0;
            let container = document.getElementById("enfantsContainer");
            container.innerHTML = "";
            for (let i = 0; i < nb; i++) {
                let div = document.createElement("div");
                div.classList.add('child-card');
                div.innerHTML = ` 
                    <div style="margin-bottom: 12px;">
                        <label for="nomEnfant${i}">Nom de l'Enfant ${i + 1} :</label>
                        <input type="text" name="nomEnfant${i}" id="nomEnfant${i}" placeholder="Prénom de l'enfant" required />
                    </div>
                    <div>
                        <label for="ageEnfant${i}">Âge : <span id="ageValeur${i}" style="color:#ffcc00; font-weight:bold;">5 ans</span></label>
                        <input type="range" name="ageEnfant${i}" id="ageEnfant${i}" class="age-slider" min="0" max="22" value="5" oninput="updateAge(${i})">
                    </div>
                `;
                container.appendChild(div);
            }
        }

        function showError(message) {
            let errorMessage = document.getElementById("errorMessage");
            errorMessage.textContent = message;
            errorMessage.style.display = "block";
        }

        function validerFormulaire() {
            let salaire = document.getElementById("salaire").value;
            let nbEnfants = document.getElementById("nbEnfants").value;
            let factures = document.querySelectorAll('input[type="checkbox"]:checked');

            document.getElementById("errorMessage").style.display = "none";

            if (salaire <= 0) {
                showError("Veuillez définir un salaire valide.");
                return false;
            }

            if (nbEnfants < 0) {
                showError("Veuillez entrer un nombre valide d'enfants.");
                return false;
            }

            for (let i = 0; i < nbEnfants; i++) {
                let nomEnfant = document.getElementById(`nomEnfant${i}`) ? document.getElementById(`nomEnfant${i}`).value.trim() : "";
                if (!nomEnfant) {
                    showError("Veuillez entrer le nom de tous les enfants.");
                    return false;
                }
            }

            if (factures.length === 0) {
                showError("Veuillez sélectionner au moins une facture.");
                return false;
            }

            let montantsFactures = document.querySelectorAll('.facture-item');
            for (let i = 0; i < montantsFactures.length; i++) {
                let checkbox = montantsFactures[i].querySelector('input[type="checkbox"]');
                let montantInput = montantsFactures[i].querySelector('input[type="number"]');

                if (checkbox && checkbox.checked) {
                    if (!montantInput || montantInput.value.trim() === "") {
                        showError("Veuillez remplir tous les montants des factures sélectionnées.");
                        return false;
                    }
                }
            }

            return true;
        }

        // Initialize display
        updateSalaire();
    </script>
</body>
</html>
