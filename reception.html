<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Familiale</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #3b4371, #f3904f);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            color: white;
            text-align: center;
            overflow: auto;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        h2 {
            font-family: 'Bangers', cursive;
            font-size: 36px;
            margin-bottom: 15px;
            color: #ffcc00;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }

        label {
            font-size: 18px;
            margin-bottom: 5px;
            display: block;
            font-weight: 600;
        }

        input[type="range"],
        input[type="number"],
        input[type="text"] {
            padding: 10px;
            margin: 8px 0;
            width: 80%;
            border: none;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.3);
            color: white;
            font-family: 'Poppins', sans-serif;
            transition: background 0.3s ease;
        }

        input[type="range"]:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .slider-container {
            position: relative;
            width: 80%;
            margin: 20px auto;
        }

        .salary-slider,
        .age-slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 12px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            outline: none;
            transition: background 0.3s ease;
        }

        .salary-slider:hover,
        .age-slider:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .salary-slider::-webkit-slider-thumb,
        .age-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ffcc00;
            cursor: pointer;
        }

        .salary-slider::-moz-range-thumb,
        .age-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ffcc00;
            cursor: pointer;
        }

        #salaireValeur {
            font-size: 25px;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
            transition: color 0.3s ease, transform 0.3s ease;
        }

        #salaireValeur:hover {
            color: #fff;
            transform: scale(1.1);
        }

        .factures {
            margin-top: 20px;
        }

        .facture-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            transition: background 0.3s ease;
        }

        .facture-item:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .facture-item input[type="number"] {
            width: 100px;
            padding: 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }

        .facture-item label {
            font-size: 16px;
            font-weight: 600;
            color: #ffcc00;
        }

        .facture-item input[type="checkbox"] {
            margin-right: 10px;
        }

        .facture-item button {
            padding: 8px 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .facture-item button:hover {
            background: #45a049;
        }

        .facture-icon {
            font-size: 20px;
            color: #ffcc00;
            margin-right: 10px;
        }

        .facture-item .remove-btn {
            background: #e64a19;
        }

        .facture-item .remove-btn:hover {
            background: #d43f00;
        }

        .factures-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 10px 18px;
            margin-top: 8px;
            border: none;
            border-radius: 5px;
            background: #ffcc00;
            color: #333;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
        }

        button:hover {
            background: #e6b800;
        }

        .error-message {
            background-color: #ff4747;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Gestion du Budget Familial</h2>
        <form action="salaireFacture.php" method="POST" onsubmit="return validerFormulaire()">
            <div id="errorMessage" class="error-message"></div>

            <label for="salaire">Salaire Total (DT) :</label>
            <div class="slider-container">
                <input type="range" id="salaire" name="salaire" class="salary-slider" min="0" max="6000" step="10"
                    value="0" oninput="updateSalaire()">
                <span id="salaireValeur">0 DT</span>
            </div>

            <h3>Nombre d'enfants :</h3>
            <input type="number" id="nbEnfants" name="nb_enfants" min="0" max="5" value="0"
                onchange="genererChampsEnfants()">
            <div id="enfantsContainer"></div>

            <h3>Factures :</h3>
            <div class="facture-item">
                <label><input type="checkbox" name="facture[]" value="Electricité"> <span
                        class="facture-icon">⚡</span>Électricité</label>
                <input type="number" name="montant[Electricité]" placeholder="Montant (DT)">
            </div>
            <div class="facture-item">
                <label><input type="checkbox" name="facture[]" value="Eau"> <span
                        class="facture-icon">💧</span>Eau</label>
                <input type="number" name="montant[Eau]" placeholder="Montant (DT)">
            </div>
            <div class="facture-item">
                <label><input type="checkbox" name="facture[]" value="Internet"> <span
                        class="facture-icon">🌐</span>Internet</label>
                <input type="number" name="montant[Internet]" placeholder="Montant (DT)">
            </div>
            <a href="formulaire.html">
            <button type="submit">Valider</button>
        </form>
    </div>

    <script>
        function updateSalaire() {
            let salaire = document.getElementById("salaire").value;
            let salaireTexte = salaire + " DT";
            document.getElementById("salaireValeur").textContent = salaireTexte;
        }

        function updateAge(index) {
            let age = document.getElementById(`ageEnfant${index}`).value;
            document.getElementById(`ageValeur${index}`).textContent = age + " ans";
        }

        function genererChampsEnfants() {
            let nb = document.getElementById("nbEnfants").value;
            let container = document.getElementById("enfantsContainer");
            container.innerHTML = "";
            for (let i = 0; i < nb; i++) {
                let div = document.createElement("div");
                div.classList.add('age-slider-container');
                div.innerHTML = ` 
                    <div class="child-name-container">
                        <label class="child-name-label" for="nomEnfant${i}">Nom de l'Enfant ${i + 1} :</label>
                        <input type="text" name="nomEnfant${i}" id="nomEnfant${i}" class="child-name-input" placeholder="Nom de l'enfant" />
                    </div>
                    <label class="age-slider-label" for="ageEnfant${i}">Âge</label>
                    <input type="range" name="ageEnfant${i}" id="ageEnfant${i}" class="age-slider" min="0" max="22" value="0" oninput="updateAge(${i})">
                    <span id="ageValeur${i}" class="age-value">0 ans</span>
                `;
                container.appendChild(div);
            }
        }

        function showError(message) {
            let errorMessage = document.getElementById("errorMessage");
            errorMessage.textContent = message;
            errorMessage.style.display = "block";
        }

        function validerFormulaire() {
            let salaire = document.getElementById("salaire").value;
            let nbEnfants = document.getElementById("nbEnfants").value;
            let factures = document.querySelectorAll('input[type="checkbox"]:checked');
            let enfantsValides = true;

            // Réinitialiser le message d'erreur
            document.getElementById("errorMessage").style.display = "none";

            // Vérifier si le salaire est défini
            if (salaire <= 0) {
                showError("Veuillez entrer un salaire valide.");
                return false;
            }

            // Vérifier si le nombre d'enfants est valide
            if (nbEnfants < 0) {
                showError("Veuillez entrer un nombre valide d'enfants.");
                return false;
            }

            // Vérifier si les noms des enfants sont remplis
            for (let i = 0; i < nbEnfants; i++) {
                let nomEnfant = document.getElementById(`nomEnfant${i}`).value;
                if (!nomEnfant) {
                    showError("Veuillez entrer le nom de tous les enfants.");
                    return false;
                }
            }

            // Vérifier si au moins une facture est sélectionnée
            if (factures.length === 0) {
                showError("Veuillez sélectionner au moins une facture.");
                return false;
            }

            // Vérifier que les montants des factures sont remplis
            let montantsFactures = document.querySelectorAll('.facture-item');
            for (let i = 0; i < montantsFactures.length; i++) {
                let checkbox = montantsFactures[i].querySelector('input[type="checkbox"]');
                let montantInput = montantsFactures[i].querySelector('input[type="number"]');

                if (checkbox && checkbox.checked) {
                    if (!montantInput || montantInput.value.trim() === "") {
                        showError("Veuillez remplir tous les montants des factures.");
                        return false;
                    }
                }
            }

            // If at least one checked facture is valid, return true
            return true;


            // Si tout est valide
            return true;
        }
    </script>
</body>

</html>
