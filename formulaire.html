<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - 3ayelti</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gradient-bg: linear-gradient(135deg, #1f2440 0%, #3b4371 50%, #f3904f 100%);
            --gold: #ffcc00;
            --gold-hover: #ffe066;
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 20px;
            background: var(--gradient-bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            color: white;
            text-align: center;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: var(--glass-shadow);
            width: 100%;
            max-width: 380px;
            position: relative;
            animation: fadeInUp 0.7s ease-out;
        }

        h2 {
            font-family: 'Bangers', cursive;
            font-size: 38px;
            margin-bottom: 20px;
            color: var(--gold);
            letter-spacing: 2px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4);
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            display: block;
            color: rgba(255, 255, 255, 0.9);
        }

        input {
            padding: 12px 16px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        input:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: var(--gold);
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.4);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #ffcc00, #ff9900);
            color: #2c3e50;
            font-family: 'Poppins', sans-serif;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 16px rgba(255, 204, 0, 0.3);
        }

        button:hover {
            background: linear-gradient(135deg, #ffe066, #ffaa00);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 204, 0, 0.5);
        }

        .links {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        a {
            color: var(--gold);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        a:hover {
            color: var(--gold-hover);
            text-decoration: underline;
        }

        .retour {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 18px;
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 8px;
            transition: background 0.3s ease;
        }

        .retour:hover {
            background: rgba(255, 255, 255, 0.4);
            text-decoration: none;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <a href="acceuil.html" class="retour">⬅ Accueil</a>
    <div class="container">
        <h2>Connexion</h2>
        <form action="login.php" method="post">
            <div class="form-group">
                <label for="email">Adresse Email</label>
                <input type="email" id="email" name="email" placeholder="exemple@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Mot de Passe</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit">Se connecter 🚀</button>
        </form>
        <div class="links">
            <a href="inscription.html">Pas encore de compte ? Créer un compte 3ayelti</a>
        </div>
    </div>
</body>
</html>
